spring.application.name=ecom

# Connection establish timeout and pool size
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5

# MySQL database information
spring.datasource.url=jdbc:mysql://localhost:3306/online_store_db
spring.datasource.username=onlinestoreuser1
spring.datasource.password=onlinestore#User1
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Sequence is not supported in MySQL hence the next entry us important
spring.jpa.hibernate.use-new-id-generator-mappings=false;
