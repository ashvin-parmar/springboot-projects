spring.application.name=learn

# configure web
server.port=8181
server.servlet.context-path=/learn

# configure customer property
my.name=Ashvin Parmar

# configure DevTools
# Enable automatic application restarts when files change, we have to trigger it using 'mvn compile' from another terminal
# spring.devtools.restart.enabled=true  

# Additional paths to watch for changes (comma-separated)
spring.devtools.restart.additional-paths=src/main/resources
# Paths to exclude from triggering a restart
spring.devtools.restart.exclude=static/**,public/**,templates/**

# Disable caching for web templates so changes reflect immediately 
spring.thymeleaf.cache=false 



# include all endpoints - Do not use this
# management.endpoints.web.exposure.include=*  
# exclude endpoints
# management.endpoints.web.exposure.exclude=env,beans 

  
# include only specific endpoints
management.endpoints.web.exposure.include=health,info 
# enable info environment variable access
management.info.env.enabled=true

# provide information envs
info.app.name=Learning SpringBoot
info.app.description=A SpringBoot learning repository
info.app.version=1.0.0
info.app.custom.name=customer name


# implementing security
# Show full details only to authorized/authenticated users, not the public
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized

management.endpoint.env.enabled=false
management.endpoint.shutdown.enabled=false

