<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="" />
        <meta name="author" content="" />
        <title>Register - SB Admin</title>
        <link href="css/styles.css" rel="stylesheet" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
        <script>
          function validate(form)
          {
            var valid=true;
            var jdbcDriver=form.driver.value.trim();
            if(jdbcDriver.length==0) 
            {
              form.jdbcDriver.focus();
              return false;
            }
            var connectionString=form.connectionString.value.trim();
            if(connectionString.length==0)
            {
              form.connectionString.focus();
              return false;
            }
            var username=form.username.value.trim();
            if(username.length==0)
            {
              form.username.focus();
              return false;
            }
            var password=form.password.value;
            if(password.length==0)
            {
              form.password.focus();
              return false;
            }
            var administratorUsername=form.administratorUsername.value.trim();
            if(administratorUsername.length==0)
            {
              form.administratorUsername.focus();
              return false;
            }
            var administratorPassword=form.administratorPassword.value;
            if(administratorPassword.length==0)
            {
              form.administratorPassword.focus();
              return false;
            }
          return true;
          }
        </script>
    </head>
    <body class="bg-primary">
        <div id="layoutAuthentication">
            <div id="layoutAuthentication_content">
                <main>
                    <div class="container">
                        <div class="row justify-content-center">
                            <div class="col-lg-7">
                                <div class="card shadow-lg border-0 rounded-lg mt-5">
                                    <div class="card-header"><h3 class="text-center font-weight-light my-4">Installer</h3></div>
                                    <div class="card-body">
                                        <form method="POST" action="/install" onsubmit="return validate(this)">
                                          <div>
                                            <b>Database Installation</b>
                                            <div class="form-floating mb-3">
                                                <input class="form-control" id="driver" type="text" name="driver" placeholder="com.mysql.cj.jdbc.Driver" required />
                                                <label for="driver">JDBC Driver</label>
                                            </div>
                                            <div class="form-floating mb-3">
                                              <input class="form-control" id="connectionString" name="connectionString" type="text" placeholder="jdbc:mysql:<host>:<port>/<db-name>" required />
                                                <label for="connectionString">Connection string</label>
                                            </div>
                                            <div class="form-floating mb-3">
                                                <input class="form-control" id="username" name="username" type="text" placeholder="username" required />
                                                <label for="username">Username</label>
                                            </div>
                                            <div class="form-floating mb-3">
                                              <input class="form-control" id="password" name="password" type="password" placeholder="password" required />
                                                <label for="password">Password</label>
                                            </div>
                                          </div>
                                          <div>
                                            <b>Administrate</b>
                                            <div class="form-floating mb-3">
                                                <input class="form-control" id="administratorUsername" name="administratorUsername" type="text" placeholder="Administrator username" required/>
                                                <label for="administratorUsername">Administrator username</label>
                                            </div>
                                            <div class="form-floating mb-3">
                                              <input class="form-control" id="administratorPassword" name="administratorPassword" type="password" placeholder="Administrator password" required />
                                                <label for="administratorPassword">Administrator password</label>
                                            </div>
                                          </div>

                                            <div class="mt-4 mb-0">
                                                <div class="d-grid"><button type='submit' class="btn btn-primary btn-block" >Install</button></div>
                                            </div>
                                        </form>
                                    </div>
                                    <div class="card-footer text-center py-3">
                                        <div class="small"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </main>
            </div>
            <div id="layoutAuthentication_footer">
                <footer class="py-4 bg-light mt-auto">
                    <div class="container-fluid px-4">
                        <div class="d-flex align-items-center justify-content-between small">
                            <div class="text-muted">Copyright &copy; Your Website 2023</div>
                            <div>
                                <a href="#">Privacy Policy</a>
                                &middot;
                                <a href="#">Terms &amp; Conditions</a>
                            </div>
                        </div>
                    </div>
                </footer>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script src="js/scripts.js"></script>
    </body>
</html>
