<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
        <meta name="description" content="Add student form" />
        <meta name="author" content="Ashvin Parmar" />
        <title>Message Board - Add Student</title>
        <link href="https://cdn.jsdelivr.net/npm/simple-datatables@7.1.2/dist/style.min.css" rel="stylesheet" />
        <link th:href="@{/css/styles.css}" rel="stylesheet" />
        <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    </head>
    <body class="sb-nav-fixed">
        <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark">
            <!-- Navbar Brand-->
            <a class="navbar-brand ps-3" href="/home">Message Board</a>
            <!-- Sidebar Toggle-->
            <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle" href="#!"><i class="fas fa-bars"></i></button>
            <!-- Navbar Search-->
            <form class="d-none d-md-inline-block form-inline ms-auto me-0 me-md-3 my-2 my-md-0">
                <div class="input-group">
                    <input class="form-control" type="text" placeholder="Search for..." aria-label="Search for..." aria-describedby="btnNavbarSearch" />
                    <button class="btn btn-primary" id="btnNavbarSearch" type="button"><i class="fas fa-search"></i></button>
                </div>
            </form>
            <!-- Navbar-->
            <ul class="navbar-nav ms-auto ms-md-0 me-3 me-lg-4">
                <li class="nav-item dropdown">
                    <a class="nav-link dropdown-toggle" id="navbarDropdown" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false"><i class="fas fa-user fa-fw"></i></a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="navbarDropdown">
                        <li><a class="dropdown-item" href="/logout">Logout</a></li>
                    </ul>
                </li>
            </ul>
        </nav>
        <div id="layoutSidenav">
            <div id="layoutSidenav_nav">
                <nav class="sb-sidenav accordion sb-sidenav-dark" id="sidenavAccordion">
                    <div class="sb-sidenav-menu">
                        <div class="nav">
                            <div class="sb-sidenav-menu-heading">Core</div>
                            <a class="nav-link" href="/home">
                                <div class="sb-nav-link-icon"><i class="fas fa-tachometer-alt"></i></div>
                                Dashboard
                            </a>
                            <a class="nav-link" href="/students">
                                <div class="sb-nav-link-icon"><i class="fas fa-table"></i></div>
                                Students
                            </a>
                        </div>
                    </div>
                    <div class="sb-sidenav-footer">
                        <div class="small">Logged in as:</div>
                        Username
                    </div>
                </nav>
            </div>
            <div id="layoutSidenav_content">
                <main>
                    <div class="container-fluid px-4">
                        <h1 class="mt-4">Add Student</h1>
                        <ol class="breadcrumb mb-4">
                            <li class="breadcrumb-item"><a href="/home">Dashboard</a></li>
                            <li class="breadcrumb-item active"><a href='/students'>Students</a></li>
                            <li class='breadcrumb-item active'>Add</li>
                        </ol>
                        <div class="card mb-4">
                            <div class="card-header">
                                <i class="fas fa-user-plus me-1"></i>
                                New Student
                            </div>
                            <div class="card-body">
                                <div id="errorMsg" class="alert alert-danger d-none" role="alert"></div>
                                <form id="addStudentForm">
                                    <div class='row mb-3'>
                                        <div class='col-md-6'>
                                            <label for='rollNumber'>Roll Number</label>
                                            <input type='text' class='form-control' id='rollNumber' name='rollNumber' placeholder="RN100001" required>
                                        </div>
                                    </div>
                                    <div class='row mb-3'>
                                        <div class='col-md-6'>
                                            <label for='firstName'>First Name</label>
                                            <input type='text' class='form-control' id='firstName' name='firstName' placeholder="First Name" required>
                                        </div>
                                        <div class='col-md-6'>
                                            <label for='lastName'>Last Name</label>
                                            <input type='text' class='form-control' id='lastName' name='lastName' placeholder="Last Name" required>
                                        </div>
                                    </div>
                                    <div class='row mb-3'>
                                        <div class='col-md-6'>
                                            <label for='emailID'>Email ID</label>
                                            <input type='email' class='form-control' id='emailID' name='emailID' placeholder="example@gmail.com" required>
                                        </div>
                                        <div class='col-md-6'>
                                            <label for='password'>Password</label>
                                            <input type='password' class='form-control' id='password' name='password' placeholder="Min. 8 characters" required>
                                        </div>
                                    </div>
                                    <div class='row mb-3'>
                                        <div class='col-md-6'>
                                            <label for='branchCode'>Branch</label>
                                            <select class='form-select' id='branchCode' name='branchCode' required>
                                                <option value=''>-- Select Branch --</option>
                                                <option th:each="b : ${messageBoardBean.branches}"
                                                        th:value="${b.code}"
                                                        th:text="${b.name}"></option>
                                            </select>
                                        </div>
                                        <div class='col-md-6'>
                                            <label for='semesterCode'>Semester</label>
                                            <select class='form-select' id='semesterCode' name='semesterCode' required>
                                                <option value=''>-- Select Semester --</option>
                                                <option th:each="sem : ${messageBoardBean.semesters}"
                                                        th:value="${sem.code}"
                                                        th:text="${sem.name}"></option>
                                            </select>
                                        </div>
                                    </div>
                                    <div class='row mt-3'>
                                        <div class='col-md-12'>
                                            <button type='button' class='btn btn-primary' onclick='submitAddStudent()'>
                                                <i class='fas fa-user-plus me-1'></i> Add Student
                                            </button>
                                            <a href='/students' class='btn btn-secondary ms-2'>Cancel</a>
                                        </div>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </main>
                <footer class="py-4 bg-light mt-auto">
                    <div class="container-fluid px-4">
                        <div class="d-flex align-items-center justify-content-between small">
                            <div class="text-muted">Copyright &copy; MessageBoard 2026</div>
                            <div></div>
                        </div>
                    </div>
                </footer>
            </div>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
        <script th:src="@{/js/scripts.js}"></script>
        <script>
        async function submitAddStudent() {
            const form = document.getElementById('addStudentForm');
            const errorMsg = document.getElementById('errorMsg');
            errorMsg.classList.add('d-none');

            const data = new FormData(form);
            try {
                const res = await fetch('/student/add', { method: 'POST', body: data });
                const json = await res.json();
                if (json.success) {
                    window.location.href = '/students';
                } else {
                    errorMsg.textContent = 'Error: ' + json.exception;
                    errorMsg.classList.remove('d-none');
                }
            } catch(e) {
                errorMsg.textContent = 'Request failed: ' + e.message;
                errorMsg.classList.remove('d-none');
            }
        }
        </script>
    </body>
</html>
